<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FITsure - Sign Up</title>
<!-- Tailwind CSS v3 CDN with Forms and Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              lime: '#97E432',
              'lime-light': '#bef264',
              'lime-subtle': '#ecfccb',
              'lime-mist': '#f7fee7',
              dark: '#111827',
              slate: '#334155',
              muted: '#64748b'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'glow-lime': '0 4px 20px -2px rgba(151, 228, 50, 0.45)',
          }
        }
      }
    }
  </script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-scrollbars">
    /* Subtle scrollbar hiding for native iOS app feel */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-4 md:py-8 flex items-center justify-center font-sans antialiased text-slate-800">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[390px] mx-auto bg-white rounded-[40px] border-[4px] border-black shadow-2xl overflow-hidden flex flex-col min-h-[820px] relative">
<!-- BEGIN: iOSStatusBar -->
<section class="pt-3 px-7 pb-2 flex justify-between items-center bg-white z-20" data-purpose="ios-status-bar">
<span class="text-xs font-semibold tracking-tight text-slate-900">9:41</span>
<!-- Dynamic Island / Speaker Notch Simulation -->
<div class="w-24 h-4 bg-black rounded-full mx-auto -mt-1 hidden sm:block"></div>
<div class="flex items-center space-x-1.5 text-slate-900">
<!-- Signal Strength -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path></svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4z"></path></svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-slate-800 rounded-sm p-0.5 flex items-center">
<div class="h-full w-3 bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</section>
<!-- END: iOSStatusBar -->
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-6 pt-2 pb-6 flex flex-col justify-between">
<div>
<!-- BEGIN: NavigationAndStepHeader -->
<header class="flex items-center justify-between mt-1 mb-5" data-purpose="screen-header">
<!-- Back Button -->
<button aria-label="Go back" class="w-9 h-9 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-700 hover:bg-brand-lime-subtle transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Step Badge -->
<div class="flex items-center gap-1.5 bg-brand-lime-subtle px-3 py-1 rounded-full border border-brand-lime-light">
<span class="w-2 h-2 rounded-full bg-brand-lime animate-pulse"></span>
<span class="text-xs font-semibold text-slate-800 tracking-wide">Step 1 of 3</span>
</div>
</header>
<!-- END: NavigationAndStepHeader -->
<!-- BEGIN: TitleSection -->
<section class="mb-6 text-center" data-purpose="header-title">
<!-- Small Brand Mark -->
<div class="inline-flex items-center justify-center gap-1.5 px-2.5 py-1 mb-2.5 bg-slate-50 border border-slate-100 rounded-lg">
<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-bold tracking-wider uppercase text-slate-700">FITsure Telemetry</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-brand-dark">Sign up</h1>
<p class="text-xs text-brand-muted mt-1 px-4 leading-relaxed">
            Connect your clinical telemetry &amp; personal health guardian
          </p>
</section>
<!-- END: TitleSection -->
<!-- BEGIN: SignUpForm -->
<form class="space-y-4" data-purpose="registration-form">
<!-- Email Input Field -->
<div data-purpose="email-field">
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="email">Email Address</label>
<div class="relative rounded-2xl shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full rounded-2xl border-slate-200 pl-10 pr-4 py-2.5 text-xs text-slate-900 placeholder:text-slate-400 focus:border-brand-lime focus:ring-2 focus:ring-brand-lime-subtle focus:outline-none transition-all" id="email" name="email" placeholder="Enter your Email Address" required="" type="email"/>
</div>
</div>
<!-- Password Input Field -->
<div data-purpose="password-field">
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="password">Password</label>
<div class="relative rounded-2xl shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full rounded-2xl border-slate-200 pl-10 pr-10 py-2.5 text-xs text-slate-900 placeholder:text-slate-400 focus:border-brand-lime focus:ring-2 focus:ring-brand-lime-subtle focus:outline-none transition-all" id="password" name="password" placeholder="Create Password" required="" type="password"/>
<!-- Password Toggle Icon Button -->
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600" type="button">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Confirm Password Input Field -->
<div data-purpose="confirm-password-field">
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="confirm-password">Confirm Password</label>
<div class="relative rounded-2xl shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full rounded-2xl border-slate-200 pl-10 pr-10 py-2.5 text-xs text-slate-900 placeholder:text-slate-400 focus:border-brand-lime focus:ring-2 focus:ring-brand-lime-subtle focus:outline-none transition-all" id="confirm-password" name="confirm-password" placeholder="Re-enter Password" required="" type="password"/>
<!-- Password Toggle Icon Button -->
<button aria-label="Toggle confirm password visibility" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600" type="button">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Terms & HIPAA Agreement Checkbox -->
<div class="flex items-start pt-1" data-purpose="terms-checkbox">
<div class="flex items-center h-4 mt-0.5">
<input class="h-4 w-4 rounded border-slate-300 text-brand-lime focus:ring-brand-lime accent-[#97E432]" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-2.5 text-[11px] leading-tight text-slate-600">
<label class="cursor-pointer" for="terms">
                I agree with <a class="font-semibold text-slate-900 underline hover:text-brand-dark" href="#">Privacy Policy</a> and <a class="font-semibold text-slate-900 underline hover:text-brand-dark" href="#">HIPAA Telemetry Terms</a>
</label>
</div>
</div>
<!-- Primary Sign Up Button -->
<div class="pt-2">
<button class="w-full bg-brand-lime text-slate-900 font-bold text-sm py-3 px-6 rounded-full shadow-glow-lime hover:bg-brand-lime-light active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2 border border-brand-lime-light" type="submit">
<span>Sign up</span>
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
<!-- END: SignUpForm -->
<!-- BEGIN: SocialAuthentication -->
<section class="mt-6" data-purpose="social-auth">
<div class="relative flex py-1 items-center">
<div class="flex-grow border-t border-slate-200"></div>
<span class="flex-shrink mx-3 text-[11px] text-slate-400 font-medium">Or sign up with</span>
<div class="flex-grow border-t border-slate-200"></div>
</div>
<!-- Social Buttons Grid matching CareSync Layout -->
<div class="grid grid-cols-2 gap-3 mt-4">
<!-- Facebook Button -->
<button class="flex items-center justify-center gap-2 py-2.5 px-3 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-colors shadow-sm text-xs font-semibold text-slate-700" type="button">
<!-- Facebook Icon -->
<svg class="w-4 h-4 text-[#1877F2] fill-current" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span>Facebook</span>
</button>
<!-- Google Button -->
<button class="flex items-center justify-center gap-2 py-2.5 px-3 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-colors shadow-sm text-xs font-semibold text-slate-700" type="button">
<!-- Google Icon -->
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.87c2.26-2.09 3.57-5.17 3.57-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3.05c-1.08.72-2.45 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96H1.27v3.15C3.25 21.36 7.31 24 12 24z" fill="#34A853"></path>
<path d="M5.27 14.24A7.18 7.18 0 0 1 4.89 12c0-.78.14-1.53.38-2.24V6.61H1.27A11.97 11.97 0 0 0 0 12c0 1.92.45 3.74 1.27 5.39l4-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.64 1.27 6.61l4 3.15c.95-2.85 3.6-4.96 6.73-4.96z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
</div>
</section>
<!-- END: SocialAuthentication -->
</div>
<!-- BEGIN: BottomGuaranteeAndLoginLink -->
<footer class="mt-6 pt-2" data-purpose="footer-links">
<!-- Log In Redirect Link -->
<p class="text-center text-xs text-slate-600 mb-3">
          Already have an Account? 
          <a class="font-bold text-slate-900 hover:text-brand-lime underline decoration-brand-lime decoration-2 underline-offset-2 ml-1" href="#">Log in</a>
</p>
<!-- Clinical Security & HIPAA Badge -->
<div class="bg-slate-50 border border-slate-100 rounded-xl py-2 px-3 flex items-center justify-center gap-2" data-purpose="security-guarantee-badge">
<svg class="w-3.5 h-3.5 text-emerald-600 flex-shrink-0" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
<span class="text-[10px] text-slate-500 font-medium tracking-tight">256-Bit Encrypted • HIPAA Telemetry Compliant</span>
</div>
<!-- iOS Bottom Indicator Bar -->
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: BottomGuaranteeAndLoginLink -->
</div>
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
