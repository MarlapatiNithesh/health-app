services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellness_db
      POSTGRES_USER: wellness_app
      POSTGRES_PASSWORD: wellness_app
    ports:
      - "5433:5432"
    volumes:
      - wellness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wellness_app -d wellness_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  wellness-postgres:
